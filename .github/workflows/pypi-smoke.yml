name: pypi-smoke

# Post-publish smoke test: install arbez-dmtx FROM PyPI (the real published
# wheels, NOT a local build) and run the test suite on every platform x Python.
# build.yml proves the wheels we *build* are good; this proves the wheels users
# actually `pip install` are good — across macOS arm64, Linux x86_64/aarch64
# (glibc/manylinux + musl/musllinux) and Windows, on CPython 3.10-3.14 incl.
# free-threaded 3.13t/3.14t.
#
# Manual / scheduled only — it depends on PyPI state, not on this commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to test (e.g. 0.0.2). Empty = latest on PyPI."
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 6 * * 1'   # weekly Mon 06:17 UTC — catch a yanked/broken release

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            os: macos-14
            container: ''
          - id: linux-x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          # musllinux runs via `docker run` on the GLIBC host (container: '' + plat:),
          # NOT a job-level container: GitHub Actions cannot run Node actions
          # (checkout / setup-uv) inside an Alpine ARM64 container ("JavaScript Actions
          # in Alpine containers are only supported on x64 Linux runners"). So checkout
          # runs on the host and the from-PyPI smoke runs in the musl image against the
          # mounted tests/ — the same host-docker pattern as build.yml.
          - id: musllinux-x86_64
            os: ubuntu-latest
            container: ''
            plat: musllinux_1_2_x86_64
          - id: musllinux-aarch64
            os: ubuntu-24.04-arm
            container: ''
            plat: musllinux_1_2_aarch64
          - id: windows-amd64
            os: windows-latest
            container: ''
    steps:
      # Only tests/ is used from the checkout; the package itself comes from PyPI.
      - uses: actions/checkout@v7

      - name: Resolve install spec
        id: spec
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "spec=arbez-dmtx==${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=arbez-dmtx" >> "$GITHUB_OUTPUT"
          fi

      # Host smoke path = macOS / Windows only. musllinux rows also have
      # container: '' but are smoke-tested inside their docker step below (a musl
      # wheel won't install on the glibc host), so exclude them here.
      - name: Set up uv (host)
        if: matrix.container == '' && !startsWith(matrix.id, 'musllinux')
        uses: astral-sh/setup-uv@v10

      # --only-binary=:all: makes the intent explicit: a matching wheel must
      # exist on PyPI for this platform x Python. There is no sdist, so a missing
      # wheel fails loudly here instead of silently trying to build from source.
      - name: "Smoke (host: uv)"
        if: matrix.container == '' && !startsWith(matrix.id, 'musllinux')
        shell: bash
        env:
          SPEC: ${{ steps.spec.outputs.spec }}
        run: |
          set -e
          # 3.15 / 3.15t stay off this from-PyPI loop until the published
          # release allows them (0.0.2 declares Requires-Python <3.15).
          for V in 3.10 3.11 3.12 3.13 3.14 3.13t 3.14t; do
            echo "::group::Python $V"
            uv venv ".t$V" --python "$V" || { echo "skip $V (unavailable)"; echo "::endgroup::"; continue; }
            PY=".t$V/bin/python"; [ -x "$PY" ] || PY=".t$V/Scripts/python.exe"
            uv pip install --python "$PY" --only-binary=:all: pytest pillow "$SPEC"
            uv pip install --python "$PY" numpy || echo "numpy unavailable on $V (ndarray test self-skips)"
            "$PY" -c "import sys, arbez_dmtx; print('  from-PyPI', arbez_dmtx.__version__, 'libdmtx', arbez_dmtx.libdmtx_version(), '| gil', getattr(sys,'_is_gil_enabled',lambda:'n/a')()); print('  at', arbez_dmtx.__file__)"
            "$PY" -m pytest tests -q
            echo "::endgroup::"
          done

      - name: "Smoke (manylinux: /opt/python, uv fallback)"
        if: matrix.container != ''
        shell: bash
        env:
          SPEC: ${{ steps.spec.outputs.spec }}
        run: |
          set -e
          # The manylinux_2_28 / musllinux_1_2 images ship most cpXY[t] interpreters under
          # /opt/python, but not all (e.g. cp313t is currently absent). Prefer
          # /opt/python; for any version it lacks, provision the interpreter with
          # uv so the matrix is literally complete. The single py3-none-<plat>
          # wheel is identical across Pythons, so this exercises the same wheel.
          /opt/python/cp312-cp312/bin/pip install -q --upgrade uv
          UV=/opt/python/cp312-cp312/bin/uv
          # 3.15 / 3.15t stay off this from-PyPI loop until the published
          # release allows them (0.0.2 declares Requires-Python <3.15).
          for V in 3.10 3.11 3.12 3.13 3.14 3.13t 3.14t; do
            echo "::group::Python $V"
            nodots="${V//./}"                       # 3.13 -> 313 ; 3.13t -> 313t
            case "$V" in
              *t) base="${nodots%t}"; P="/opt/python/cp${base}-cp${base}t/bin/python" ;;  # -> cp313-cp313t
              *)  P="/opt/python/cp${nodots}-cp${nodots}/bin/python" ;;                    # -> cp313-cp313
            esac
            if [ -x "$P" ]; then
              PY="$P"
              "$PY" -m pip install --upgrade pip >/dev/null
              "$PY" -m pip install --only-binary=:all: pytest pillow "$SPEC"
              "$PY" -m pip install numpy || echo "numpy unavailable (ndarray test self-skips)"
            else
              echo "  /opt/python lacks $V -> provisioning via uv"
              "$UV" venv ".t$V" --python "$V" || { echo "skip $V (uv cannot provide)"; echo "::endgroup::"; continue; }
              PY=".t$V/bin/python"
              "$UV" pip install --python "$PY" --only-binary=:all: pytest pillow "$SPEC"
              "$UV" pip install --python "$PY" numpy || echo "numpy unavailable (ndarray test self-skips)"
            fi
            "$PY" -c "import sys, arbez_dmtx; print('  from-PyPI', arbez_dmtx.__version__, 'libdmtx', arbez_dmtx.libdmtx_version(), '| gil', getattr(sys,'_is_gil_enabled',lambda:'n/a')()); print('  at', arbez_dmtx.__file__)"
            "$PY" -m pytest tests -q
            echo "::endgroup::"
          done

      # musllinux: install the PUBLISHED wheel from PyPI and pytest the mounted
      # tests/ INSIDE the musl image via `docker run` on the glibc host (checkout
      # ran on the host; see the matrix comment). Mirrors build.yml's musllinux
      # step but installs from PyPI instead of building. Runs natively — x86_64 on
      # the x64 runner, aarch64 on the arm64 runner.
      - name: "Smoke (musllinux via docker on glibc host)"
        if: startsWith(matrix.id, 'musllinux')
        shell: bash
        env:
          SPEC: ${{ steps.spec.outputs.spec }}
        run: |
          set -euo pipefail
          docker run --rm -e SPEC="$SPEC" -v "$PWD":/io -w /io \
            "quay.io/pypa/${{ matrix.plat }}" sh /io/scripts/musllinux_smoke_test.sh
