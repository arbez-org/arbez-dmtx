name: wheels

# CI: build + test the per-platform wheels on every push/PR. Delegates to the
# reusable build.yml so the (tricky) build logic lives in exactly one place.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .

  build:
    uses: ./.github/workflows/build.yml
