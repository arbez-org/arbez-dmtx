name: build

# Reusable matrix build of arbez-dmtx wheels (called by wheels.yml for CI
# and by release.yml before publishing). See the header in this file's build
# steps for the tag-normalization rationale.
on:
  workflow_call:
    inputs:
      version:
        description: "Override the wheel version (release.yml passes the dev/tag version). Empty = use pyproject as-is."
        required: false
        type: string
        default: ''

permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            os: macos-14
            container: ''
            plat: macosx_11_0_arm64
          - id: linux-x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            plat: manylinux_2_28_x86_64
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            plat: manylinux_2_28_aarch64
          # musllinux is built via `docker run` on the GLIBC host (container: '' —
          # see the "Build wheel + test (musllinux ...)" step), NOT as a job-level
          # container: GitHub Actions cannot run Node JS actions (checkout /
          # upload-artifact) inside an Alpine ARM64 container ("JavaScript Actions
          # in Alpine containers are only supported on x64 Linux runners"). So
          # checkout + artifact upload run on the glibc host and only the wheel
          # build runs in the musl image — the same host-docker approach cibuildwheel uses.
          - id: musllinux-x86_64
            os: ubuntu-latest
            container: ''
            plat: musllinux_1_2_x86_64
          - id: musllinux-aarch64
            os: ubuntu-24.04-arm
            container: ''
            plat: musllinux_1_2_aarch64
          - id: windows-amd64
            os: windows-latest
            container: ''
            plat: win_amd64
    steps:
      - uses: actions/checkout@v7

      # ---------- stamp the release version (only when release.yml calls us) ----------
      - name: Inject version
        if: inputs.version != ''
        shell: bash
        env:
          VER: ${{ inputs.version }}
        run: |
          set -e
          PY=python3; command -v "$PY" >/dev/null || PY=python
          command -v "$PY" >/dev/null || PY=/opt/python/cp311-cp311/bin/python
          "$PY" - "$VER" <<'PY'
          import pathlib, re, sys
          v = sys.argv[1]
          for path, pat, repl in (
              ("pyproject.toml", r'^version\s*=\s*".*"', f'version = "{v}"'),
              ("src/arbez_dmtx/__init__.py", r'^__version__\s*=\s*".*"', f'__version__ = "{v}"'),
          ):
              p = pathlib.Path(path)
              t2, n = re.subn(pat, repl, p.read_text(), count=1, flags=re.MULTILINE)
              assert n == 1, f"version line not found in {path}"
              p.write_text(t2)
              print(f"{path} -> {v}")
          PY

      # ---------- build the native libdmtx (platform-specific) ----------
      - name: Build libdmtx (macOS)
        if: matrix.id == 'macos-arm64'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'   # .dylib floor must match the macosx_11_0 tag we stamp
        run: |
          brew install autoconf automake libtool
          bash scripts/build_libdmtx.sh src/arbez_dmtx/_libdmtx

      - name: Build libdmtx (manylinux)
        if: startsWith(matrix.id, 'linux')
        run: |
          dnf install -y autoconf automake libtool >/dev/null   # manylinux_2_28 == AlmaLinux 8
          bash scripts/build_libdmtx.sh src/arbez_dmtx/_libdmtx

      # musllinux: build libdmtx + wheel + retag + twine + test ALL inside the
      # musl image via `docker run` on the glibc host (checkout already ran on the
      # host; see the matrix comment). The script writes ./dist on the host mount
      # so the shared upload-artifact step picks the wheel up. Runs natively —
      # musllinux_1_2_x86_64 on the x64 runner, musllinux_1_2_aarch64 on the arm64 runner.
      - name: Build wheel + test (musllinux via docker on glibc host)
        if: startsWith(matrix.id, 'musllinux')
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e PLAT="${{ matrix.plat }}" -v "$PWD":/io -w /io \
            "quay.io/pypa/${{ matrix.plat }}" sh /io/scripts/musllinux_build_test.sh

      - name: Build libdmtx (Windows, vcpkg)
        if: matrix.id == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libdmtx:x64-windows
          # Enforce the single-source pin: vcpkg's libdmtx must equal LIBDMTX_VERSION
          # (vcpkg verifies the upstream source via its own SHA512, covering supply
          # chain on Windows; this asserts the *version* matches the pin so the
          # Windows wheel never silently diverges from the other platforms).
          $pin = (Get-Content LIBDMTX_VERSION).Trim()
          $listed = (& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" list libdmtx) -join "`n"
          if ($listed -notmatch [regex]::Escape($pin)) {
            throw "vcpkg libdmtx does not match pinned LIBDMTX_VERSION ($pin):`n$listed`nBump the pin once vcpkg catches up, or switch Windows to a source build."
          }
          $inst = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          New-Item -ItemType Directory -Force -Path src/arbez_dmtx/_libdmtx | Out-Null
          Copy-Item "$inst\bin\dmtx.dll" src/arbez_dmtx/_libdmtx/libdmtx.dll
          # BSD-2: ship libdmtx's license text in the wheel (matched by package-data).
          Copy-Item "$inst\share\libdmtx\copyright" src/arbez_dmtx/_libdmtx/THIRD_PARTY_LICENSES_libdmtx.txt
          Get-ChildItem src/arbez_dmtx/_libdmtx

      # ---------- build wheel, force the PyPI-valid platform tag, twine check ----------
      # We RETAG the built wheel directly with `wheel tags` rather than rely on
      # the ARBEZ_DMTX_WHEEL_PLAT env reaching setup.py through build isolation
      # (uv build honours it; `python -m build` does not). The bundled native lib
      # already matches the tag's ABI floor (manylinux_2_28 container / macOS
      # deployment target 11.0), so the relabel is truthful.
      - name: Build wheel + retag + twine check (macOS)
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/bld           # venv avoids PEP 668 externally-managed system python
          P=/tmp/bld/bin/python
          "$P" -m pip install -q --upgrade build wheel twine
          "$P" -m build --wheel --outdir dist_raw
          "$P" -m wheel tags --platform-tag "${{ matrix.plat }}" --remove dist_raw/*.whl
          mkdir -p dist && mv dist_raw/*.whl dist/
          echo "wheel: $(ls dist/*.whl)"
          "$P" -m twine check dist/*.whl

      - name: Build wheel + retag + twine check (manylinux)
        if: startsWith(matrix.id, 'linux')
        shell: bash
        run: |
          set -e
          P=/opt/python/cp311-cp311/bin/python   # /opt/python is not externally-managed
          "$P" -m pip install -q --upgrade build wheel twine
          "$P" -m build --wheel --outdir dist_raw
          "$P" -m wheel tags --platform-tag "${{ matrix.plat }}" --remove dist_raw/*.whl
          mkdir -p dist && mv dist_raw/*.whl dist/
          echo "wheel: $(ls dist/*.whl)"
          case "$(ls dist/*.whl)" in *linux_x86_64.whl|*linux_aarch64.whl) echo "bare linux tag survived"; exit 1;; esac
          "$P" -m twine check dist/*.whl

      - name: Build wheel + twine check (Windows)
        if: matrix.id == 'windows-amd64'
        shell: pwsh
        run: |
          python -m venv C:\bld
          C:\bld\Scripts\python.exe -m pip install --upgrade build twine
          C:\bld\Scripts\python.exe -m build --wheel --outdir dist_raw   # win_amd64 is already PyPI-valid
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item dist_raw\*.whl dist\
          C:\bld\Scripts\python.exe -m twine check dist\*.whl

      # ---------- test the ONE platform wheel across every Python ----------
      # Install uv via the pinned action, NOT `curl | sh`: the test step runs in
      # the same job that produced dist/ (before the artifact upload), so an
      # unpinned remote installer is a supply-chain vector for the wheel.
      # Host test path = macOS / Windows only. musllinux rows also have
      # container: '' but are built+tested inside their docker step above (a musl
      # wheel won't install on the glibc host), so exclude them here.
      - name: Set up uv (host)
        if: matrix.container == '' && !startsWith(matrix.id, 'musllinux')
        uses: astral-sh/setup-uv@v10.3.0

      - name: "Test matrix (host: uv)"
        if: matrix.container == '' && !startsWith(matrix.id, 'musllinux')
        shell: bash
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          for V in 3.10 3.11 3.12 3.13 3.14 3.15 3.13t 3.14t 3.15t; do
            echo "::group::Python $V"
            uv venv ".t$V" --python "$V" || { echo "skip $V (interpreter unavailable)"; echo "::endgroup::"; continue; }
            PY=".t$V/bin/python"; [ -x "$PY" ] || PY=".t$V/Scripts/python.exe"
            # Binary-only: our wheel is py3-none, but pillow and pytest must also
            # have a wheel for THIS interpreter. Skip the cell rather than
            # source-building: there is nothing of ours to test where a user could
            # not install those dependencies as wheels. The cell turns back on
            # once the missing wheel is published.
            if ! uv pip install --python "$PY" --only-binary=:all: pytest pillow "$WHEEL"; then
              echo "skip $V (a required dependency has no binary wheel here)"
              echo "::endgroup::"; continue
            fi
            uv pip install --python "$PY" --only-binary=:all: numpy || echo "numpy unavailable on $V (ndarray test self-skips)"
            "$PY" -c "import sys,arbez_dmtx; print('  loaded', arbez_dmtx.libdmtx_version(), '| gil', getattr(sys,'_is_gil_enabled',lambda:'n/a')())"
            "$PY" -m pytest tests -q
            echo "::endgroup::"
          done

      - name: "Test matrix (manylinux: /opt/python)"
        if: matrix.container != ''
        shell: bash
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          for PY in /opt/python/cp310-cp310/bin/python \
                    /opt/python/cp311-cp311/bin/python \
                    /opt/python/cp312-cp312/bin/python \
                    /opt/python/cp313-cp313/bin/python \
                    /opt/python/cp313-cp313t/bin/python \
                    /opt/python/cp314-cp314/bin/python \
                    /opt/python/cp314-cp314t/bin/python \
                    /opt/python/cp315-cp315/bin/python \
                    /opt/python/cp315-cp315t/bin/python; do
            [ -x "$PY" ] || { echo "skip (missing): $PY"; continue; }
            echo "::group::$PY"
            "$PY" -m pip install --upgrade pip >/dev/null
            "$PY" -m pip install pytest pillow "$WHEEL"
            "$PY" -m pip install numpy || echo "numpy unavailable (ndarray test self-skips)"
            "$PY" -c "import sys,arbez_dmtx; print('  loaded', arbez_dmtx.libdmtx_version(), '| gil', getattr(sys,'_is_gil_enabled',lambda:'n/a')())"
            "$PY" -m pytest tests -q
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.id }}
          path: dist/*.whl
          if-no-files-found: error
